<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monika Tools</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    html, body {
      width: 400px !important;
      min-width: 400px;
      min-height: 600px;
      background-color: var(--theme-background);
      color: var(--theme-text);
    }

    /* 侧边栏模式 */
    @media (view-type: side-panel) {
      html, body {
        width: 100% !important;
        height: 100vh;
      }
    }

    #root {
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: var(--theme-background);
      color: var(--theme-text);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
